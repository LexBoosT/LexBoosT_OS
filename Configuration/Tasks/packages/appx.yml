---
title: AppX
privilege: TrustedInstaller
description: Remove AppX packages and disable CrossDeviceResume scheduled task
actions:
  - !status: {status: 'Removing AppX'}

  - !taskKill: {name: 'msteams*', ignoreErrors: true}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Communications', value: 'ConfigureChatAutoInstall', data: '0', type: REG_DWORD}

  # ============================================
  # Full AppX debloat — handled by APPX-REMOVER.PS1
  # Package list is read from APPX-REMOVE-LIST.TXT (single source of truth).
  # ============================================
  - !status: {status: 'Removing AppX Packages'}
  - !run:
      exeDir: true
      exe: 'powershell.exe'
      args: '-NoProfile -ExecutionPolicy Bypass -File ".\Scripts\APPX-REMOVER.PS1" -PackageCsv ".\Scripts\APPX-REMOVE-LIST.TXT" -Force'
      runas: currentUserElevated
      wait: true
      weight: 100

  # Microsoft.BioEnrollment (Windows Hello Face) must NOT be removed — it is a
  # required system component (issue report #2). Re-registering cannot restore
  # deleted files, so the directory deletion and removal-list entry were removed.
  - !file: {path: '%windir%\SystemApps\Windows.CBSPreview_cw5n1h2txyewy'}
  # Disable CrossDeviceResume scheduled task (specific to that feature)
  - !status: {status: 'Disabling CrossDevice'}
  - !run:
      exeDir: true
      exe: '.\Scripts\CROSSDEVICERESUME.CMD'
      runas: currentUserElevated
      wait: true
      weight: 200
