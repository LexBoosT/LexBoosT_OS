---
title: Gaming
description: Applies Gaming tweaks via registry values and scripts
privilege: TrustedInstaller
actions:

  # Disable opening gamebar when pressing the xbox button on an xbox controller
  - !registryValue: {path: 'HKCU\Software\Microsoft\GameBar', value: 'UseNexusForGameBarEnabled', type: REG_DWORD, data: '0'}
  # Disable opening gamebar when connecting xbox controller
  - !registryValue: {path: 'HKCR\ms-gamebar', value: '', type: REG_SZ, data: 'URL:ms-gamebar'}
  - !registryValue: {path: 'HKCR\ms-gamebar', value: 'URL Protocol', type: REG_SZ, data: ''}
  - !registryValue: {path: 'HKCR\ms-gamebar', value: 'NoOpenWith', type: REG_SZ, data: ''}
  - !registryValue: {path: 'HKCR\ms-gamebar\shell\open\command', value: '', type: REG_EXPAND_SZ, data: '%WINDIR%\System32\systray.exe'}

  - !registryValue: {path: 'HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Multimedia\\SystemProfile\\Tasks\\Games', value: 'BackgroundPriority', type: REG_DWORD, data: '1'}

  - !status: {status: 'Configuring GameDVR'}
  - !registryValue: {path: 'HKCU\\System\\GameConfigStore', value: 'GameDVR_DSEBehavior', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\\System\\GameConfigStore', value: 'GameDVR_DXGIHonorFSEWindowsCompatible', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\\System\\GameConfigStore', value: 'GameDVR_EFSEFeatureFlags', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\\System\\GameConfigStore', value: 'GameDVR_FSEBehaviorMode', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\\System\\GameConfigStore', value: 'GameDVR_HonorUserFSEBehaviorMode', type: REG_DWORD, data: '1'}

  # ============================================
  # MMCSS GAMES PROFILE — Gaming audio task scheduling
  # ============================================
  - !status: {status: 'Configuring MMCSS Games profile'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', value: 'Affinity', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', value: 'Background Only', type: REG_SZ, data: 'False'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', value: 'Clock Rate', type: REG_DWORD, data: '10000'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', value: 'GPU Priority', type: REG_DWORD, data: '8'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', value: 'Priority', type: REG_DWORD, data: '6'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', value: 'Scheduling Category', type: REG_SZ, data: 'High'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', value: 'SFIO Priority', type: REG_SZ, data: 'High'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', value: 'Latency Sensitive', type: REG_SZ, data: 'True'}

  # ============================================
  # MMCSS SYSTEM PROFILE — Additional scheduling tweaks
  # ============================================
  - !status: {status: 'Configuring MMCSS system profile'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile', value: 'AlwaysOn', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile', value: 'SchedulerPeriod', type: REG_DWORD, data: '50000'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile', value: 'MaxThreadsTotal', type: REG_DWORD, data: '65535'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile', value: 'MaxThreadsPerProcess', type: REG_DWORD, data: '128'}

  - !status: {status: 'Config Memory Compression', onUpgrade: false}
  - !run:
      exeDir: true
      exe: 'powershell.exe'
      args: '-NoProfile -ExecutionPolicy Bypass -File ".\\Scripts\\GAMING_MEMORY_COMPRESSION.PS1"'
      wait: true
      weight: 200
      onUpgrade: false

  # ============================================
  # Microsoft Games Optimization (FPS overlay)
  # ============================================
  - !status: {status: 'Configuring Microsoft Games FPS overlay'}
  - !registryValue: {path: 'HKCU\\Software\\Microsoft\\Games', value: 'FpsStatusGamesAll', type: REG_DWORD, data: '4'}
  - !registryValue: {path: 'HKCU\\Software\\Microsoft\\Games', value: 'FpsStatusGames', type: REG_DWORD, data: '10'}
  - !registryValue: {path: 'HKCU\\Software\\Microsoft\\Games', value: 'FpsAll', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKCU\\Software\\Microsoft\\Games', value: 'GameFluidity', type: REG_DWORD, data: '1'}

  # ============================================
  # Enable Optimizations for Windowed/Borderless Games
  # ============================================
  - !registryValue: {path: 'HKCU\Software\Microsoft\DirectX\UserGpuPreferences', value: 'SwapEffectUpgradeEnable', type: REG_DWORD, data: '1'}
