---
title: System
privilege: TrustedInstaller
description: Core system tweaks — values migrated to SYSTEM_TWEAKS.PS1
actions:
  - !run:
    exeDir: true
    exe: 'powershell.exe'
    args: '-NoProfile -ExecutionPolicy Bypass -File ".\Scripts\SYSTEM_TWEAKS.PS1"'
    weight: 200
    wait: true

  - !run:
    exeDir: true
    exe: 'powershell.exe'
    args: '-NoProfile -ExecutionPolicy Bypass -File ".\Scripts\DEVICES.PS1" -Device @("Configure-PowerScheme","Configure-Adapters","Configure-Drives","Configure-PowerThrottling","Configure-NDISOptimizer","Configure-DesktopPowerOptimizations","Configure-IntelHybridVisibility")'
    runas: currentUserElevated
    weight: 200
    wait: true

  - !run:
    exeDir: true
    exe: 'powershell.exe'
    args: '-NoProfile -ExecutionPolicy Bypass -File ".\Scripts\DEVICES-TWEAKER-AUTO.PS1"'
    weight: 200
    wait: true
    onUpgrade: false

  - !run:
    exeDir: true
    exe: 'powershell.exe'
    args: '-NoProfile -ExecutionPolicy Bypass -File ".\Scripts\MMCSS-NIC.PS1"'
    weight: 200
    wait: true
    onUpgrade: false

  # Intel APO (si Intel 12e gen+/Core Ultra) - no-op sur AMD
  - !run:
    exeDir: true
    exe: 'powershell.exe'
    args: '-NoProfile -ExecutionPolicy Bypass -File ".\Scripts\ENABLE-INTEL-APO.PS1"'
    weight: 200
    wait: true
    onUpgrade: false

  - !status: {status: 'Removing EFI Drive Letter'}
  - !run:
    exeDir: true
    exe: 'powershell.exe'
    args: '-NoProfile -ExecutionPolicy Bypass -File ".\Scripts\REMOVE_EFI_DRIVE_LETTER.PS1"'
    wait: true
    weight: 200
    onUpgrade: false

  # Win32PrioritySeparation - 24 = 0x18 = 3 (foreground boost, background normal)
  - !status: {status: 'Configuring Win32PrioritySeparation', onUpgrade: false}
  - !registryValue: {path: HKLM\SYSTEM\CurrentControlSet\Control\PriorityControl', value: 'Win32PrioritySeparation', type: REG_DWORD, data: '24', onUpgrade: false}

  # Enables full drive indexing
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows Search\Gather\Windows\SystemIndex', value: 'EnableFindMyFiles', type: REG_DWORD, data: '1'}

  # Monthly drive optimization
  - !powerShell:
    command: |
      $defragTask = Get-ScheduledTask -TaskPath '\Microsoft\Windows\Defrag\' -TaskName 'ScheduledDefrag' -ErrorAction SilentlyContinue
      if ($null -ne $defragTask) {
        $trigger = New-ScheduledTaskTrigger -Weekly -WeeksInterval 4 -DaysOfWeek Sunday -At 3am
        Set-ScheduledTask -TaskPath '\Microsoft\Windows\Defrag\' -TaskName 'ScheduledDefrag' -Trigger $trigger | Out-Null
        Enable-ScheduledTask -TaskPath '\Microsoft\Windows\Defrag\' -TaskName 'ScheduledDefrag' | Out-Null
      }
    wait: true

