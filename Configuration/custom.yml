---
title: LexBoosT OS™ 26.09.1
description: Applies LexBoosT OS™ 26.09.1 configuration tasks, including registry tweaks, service tweaks, and system tweaks
privilege: TrustedInstaller
actions:
  - !status: {status: 'Starting Playbook Setup'}

  - !status: {
      status: "LexBoosT OS™ 26.09.1",
    }

  # ============================================
  # INSTALL OVERLAY: black screen + animated logo + AME phases
  # ============================================
  - !run: {
      exeDir: true,
      exe: 'powershell.exe',
      args: '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File ".\Scripts\INSTALL-OVERLAY.PS1"',
      runas: currentUserElevated,
      wait: false,
      weight: 1,
    }

  # ============================================
  # PRE-INSTALL: System scan for AME Wizard log
  # ============================================
  - !powerShell: {
      command: '.\Scripts\SYSTEM-SCAN.PS1',
      exeDir: true,
      runas: currentUserElevated,
      wait: true,
      ignoreErrors: true,
      weight: 50,
    }

  - !status: {status: 'Disabling sleep'}
  - !powerShell:
    command: >-
      powercfg /x monitor-timeout-ac 0;
      powercfg /x monitor-timeout-dc 0;
      powercfg /x standby-timeout-ac 0;
      powercfg /x standby-timeout-dc 0;
      powercfg /x disk-timeout-ac 0;
      powercfg /x disk-timeout-dc 0;
      powercfg /x hibernate-timeout-ac 0;
      powercfg /x hibernate-timeout-dc 0;

  # (NGEN inline removed 26.09.1.1 - duplicate of NGEN.PS1 called from setup.yml;
  #   NGEN.PS1 is the single entry point for .NET native image generation.)

  - !taskKill: {
      name: "explorer",
      errorAction: Ignore,
    }

tasks:
  # Phase 1: Pre-setup / initialization
  - Tasks\setup.yml

  # Phase 2: AppX, features, scheduled tasks, OneDrive, Edge removal
  - Tasks\packages.yml

  # Phase 3: Service configuration
  - Tasks\services.yml

  # Phase 4: Registry tweaks by category
  - Tasks\registry.yml

  # Phase 5: Final cleanup
  - Tasks\final.yml

  - Tasks\utilities.yml
